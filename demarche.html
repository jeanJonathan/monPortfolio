<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Demarche Portfolio</title>

  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600,700" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>

</head>

<body>

<div class="main-container">

  <div class="glass-card">
    
    <h1 class="title">Portfolio Intelligence</h1>

    <div id="typewriter"></div>

    <div class="actions">
      <a href="demarche.pdf" download class="btn-download">
        Télécharger la démarche
      </a>

      <a href="index.html" class="btn-back">
        ← Retour accueil
      </a>
    </div>

  </div>

</div>

<script>

class Star {
  constructor() {
    this.x = random(-width, width);
    this.y = random(-height, height);
    this.size = random(0.5, 3);
    this.speed = random(1, 5);
  }

  move() {
    this.x += this.speed;
    this.y += this.speed * (height / width);
    if (this.x > width || this.y > height) {
      this.x = random(-width, width);
      this.y = random(-height, height);
    }
  }

  show() {
    noStroke();
    fill(255);
    ellipse(this.x, this.y, this.size, this.size);
  }
}

let stars = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  canvas.style('position', 'fixed');
  canvas.style('z-index', '-1');

  for (let i = 0; i < 100; i++) {
    stars.push(new Star());
  }

  const text = `Dans l'intention de poursuivre mes études en master en informatique par alternance, je présente ce portfolio comme une synthèse de mon parcours académique et professionnel...`;

  typeWriter(text, 0);
}

function draw() {
  background(0);
  stars.forEach(star => {
    star.move();
    star.show();
  });
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function typeWriter(text, i) {
  if (i < text.length) {
    document.getElementById("typewriter").innerHTML += text.charAt(i);
    setTimeout(() => typeWriter(text, i + 1), 25);
  }
}

</script>

<style>

body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

.main-container {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.glass-card {
  width: 80%;
  max-width: 700px;
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(20px);
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(24, 210, 110, 0.2);
  box-shadow: 0 0 40px rgba(24, 210, 110, 0.3);
  z-index: 10;
}

.title {
  color: #18d26e;
  text-align: center;
  font-size: 28px;
  margin-bottom: 25px;
}

#typewriter {
  color: #fff;
  font-size: 16px;
  line-height: 1.7;
  text-align: justify;
}

.actions {
  margin-top: 30px;
  display: flex;
  gap: 15px;
}

.btn-download, .btn-back {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  text-decoration: none;
  transition: 0.3s;
}

.btn-download {
  background: #18d26e;
  color: #000;
  font-weight: bold;
  box-shadow: 0 0 15px #18d26e;
}

.btn-download:hover {
  box-shadow: 0 0 30px #18d26e;
}

.btn-back {
  border: 1px solid #18d26e;
  color: #18d26e;
}

.btn-back:hover {
  background: #18d26e;
  color: #000;
}

@media (max-width: 768px) {
  .glass-card {
    width: 90%;
  }

  .actions {
    flex-direction: column;
  }
}

</style>

</body>
</html>
